<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universo Mágico para Diego</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- NOMBRE FIJO ARRIBA (ADAPTABLE) --- */
        #nombre-fijo {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            text-align: center;
            pointer-events: none;
            animation: latido 2s infinite;
            width: 100%;
        }

        #nombre-fijo h1 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(35px, 10vw, 60px);
            color: #ffffff;
            margin: 0;
            text-shadow: 
                0 0 10px #ff007f, 
                0 0 20px #ff007f, 
                0 0 40px #ff007f,
                0 0 80px #ffaa00;
            letter-spacing: 2px;
            line-height: 1;
        }

        #nombre-fijo p {
            font-family: 'Segoe UI', sans-serif;
            font-size: clamp(12px, 3.5vw, 16px);
            color: #ffb3d9;
            margin-top: 0;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
        }

        @keyframes latido {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }

        /* --- MARCO DE LA FOTO (ADAPTABLE) --- */
        #foto-marco {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 90;
            padding: 6px;
            background: linear-gradient(135deg, #ff007f, #ffaa00, #ff007f);
            border-radius: 18px;
            box-shadow: 
                0 0 20px #ff007f, 
                0 0 40px rgba(255, 0, 127, 0.6),
                0 0 60px rgba(255, 170, 0, 0.4);
            animation: flotar 4s ease-in-out infinite;
            max-width: 40vw;
        }

        #foto-marco img {
            display: block;
            width: clamp(120px, 35vw, 220px);
            height: auto;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes flotar {
            0% { transform: translateX(-50%) translateY(0px); }
            50% { transform: translateX(-50%) translateY(-10px); }
            100% { transform: translateX(-50%) translateY(0px); }
        }

        /* --- BOTÓN DE MÚSICA --- */
        #music-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 200;
            width: clamp(45px, 12vw, 60px);
            height: clamp(45px, 12vw, 60px);
            border-radius: 50%;
            background: rgba(255, 0, 127, 0.3);
            border: 2px solid #ff007f;
            color: white;
            font-size: clamp(20px, 6vw, 28px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px #ff007f, 0 0 40px rgba(255, 0, 127, 0.5);
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        #music-btn:active {
            transform: scale(0.95);
        }

        #music-btn.playing {
            animation: latido-musica 1.5s infinite;
        }

        @keyframes latido-musica {
            0% { box-shadow: 0 0 20px #ff007f, 0 0 40px rgba(255, 0, 127, 0.5); }
            50% { box-shadow: 0 0 40px #ff007f, 0 0 80px #ff007f; }
            100% { box-shadow: 0 0 20px #ff007f, 0 0 40px rgba(255, 0, 127, 0.5); }
        }

        #hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: clamp(10px, 3vw, 14px);
            z-index: 20;
            pointer-events: none;
            text-align: center;
            transition: opacity 2s;
            white-space: nowrap;
        }

        /* Ajuste especial para pantallas muy pequeñas */
        @media (max-height: 600px) {
            #foto-marco {
                top: 25%;
            }
            #foto-marco img {
                width: clamp(100px, 28vw, 160px);
            }
        }
    </style>
</head>
<body>

    <!-- NOMBRE FIJO ARRIBA -->
    <div id="nombre-fijo">
        <h1>Mi DIEGO</h1>
        <p>Te amooooooooo ❤️‍🩹</p>
    </div>

    <!-- FOTO FLOTANTE CON MARCO DE NEÓN -->
    <div id="foto-marco">
        <img src="foto.jpg" alt="Nuestra foto">
    </div>

    <div id="canvas-container"></div>
    <div id="hint">Arrastra para girar • Pellizca para zoom</div>

    <button id="music-btn" title="Reproducir música">🎵</button>

    <audio id="bg-music" loop>
        <source src="love-for-you.mp3" type="audio/mpeg">
        Tu navegador no soporta audio.
    </audio>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- CONTROL DE MÚSICA ---
        const musicBtn = document.getElementById('music-btn');
        const bgMusic = document.getElementById('bg-music');
        let isPlaying = false;

        function startMusicOnce() {
            if (!isPlaying) {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    musicBtn.textContent = '🔊';
                    musicBtn.classList.add('playing');
                }).catch(e => console.log("Error al reproducir:", e));
            }
            document.removeEventListener('click', startMusicOnce);
            document.removeEventListener('touchstart', startMusicOnce);
        }

        document.addEventListener('click', startMusicOnce);
        document.addEventListener('touchstart', startMusicOnce);

        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isPlaying) {
                bgMusic.pause();
                musicBtn.textContent = '🎵';
                musicBtn.classList.remove('playing');
                isPlaying = false;
            } else {
                bgMusic.play();
                musicBtn.textContent = '🔊';
                musicBtn.classList.add('playing');
                isPlaying = true;
            }
        });

        // --- ESCENA 3D ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.012); 

        // Detectar si es móvil para ajustar el rendimiento
        const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);
        const particleMultiplier = isMobile ? 0.5 : 1; // Menos partículas en móvil para que vaya fluido

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.getElementById('canvas-container').appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5; 
        controls.enableZoom = true;
        controls.enablePan = false;
        controls.minDistance = 8;
        controls.maxDistance = 40;
        controls.maxPolarAngle = Math.PI / 1.8;

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xff007f, 80, 40);
        pointLight.position.set(0, 0, 0);
        scene.add(pointLight);

        // Corazón con partículas ajustado para móvil
        const heartParticlesCount = Math.floor(5000 * particleMultiplier);
        const heartGeometry = new THREE.BufferGeometry();
        const heartPositions = new Float32Array(heartParticlesCount * 3);
        const heartColors = new Float32Array(heartParticlesCount * 3);

        for (let i = 0; i < heartParticlesCount; i++) {
            const t = Math.random() * Math.PI * 2;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            
            const spread = 0.6;
            const px = (x + (Math.random() - 0.5) * spread * 10) * 0.25;
            const py = (y + (Math.random() - 0.5) * spread * 10) * 0.25;
            const pz = (Math.random() - 0.5) * 2.5; 

            heartPositions[i*3] = px;
            heartPositions[i*3+1] = py;
            heartPositions[i*3+2] = pz;

            const color = new THREE.Color().setHSL(0.95 + Math.random()*0.05, 1, 0.5 + Math.random()*0.3);
            heartColors[i*3] = color.r;
            heartColors[i*3+1] = color.g;
            heartColors[i*3+2] = color.b;
        }

        heartGeometry.setAttribute('position', new THREE.BufferAttribute(heartPositions, 3));
        heartGeometry.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));

        const heartMaterial = new THREE.PointsMaterial({
            size: 0.12,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const heartParticles = new THREE.Points(heartGeometry, heartMaterial);
        heartParticles.position.y = 2;
        scene.add(heartParticles);

        // Vórtice ajustado para móvil
        const vortexCount = Math.floor(8000 * particleMultiplier);
        const vortexGeometry = new THREE.BufferGeometry();
        const vortexPositions = new Float32Array(vortexCount * 3);
        const vortexColors = new Float32Array(vortexCount * 3);

        for (let i = 0; i < vortexCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.pow(Math.random(), 2) * 25; 
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const y = (Math.random() - 0.5) * 2 - radius * 0.15; 

            vortexPositions[i*3] = x;
            vortexPositions[i*3+1] = y;
            vortexPositions[i*3+2] = z;

            const color = new THREE.Color().setHSL(0.85 + Math.random()*0.15, 0.8, 0.6);
            vortexColors[i*3] = color.r;
            vortexColors[i*3+1] = color.g;
            vortexColors[i*3+2] = color.b;
        }

        vortexGeometry.setAttribute('position', new THREE.BufferAttribute(vortexPositions, 3));
        vortexGeometry.setAttribute('color', new THREE.BufferAttribute(vortexColors, 3));

        const vortexMaterial = new THREE.PointsMaterial({
            size: 0.06,
            vertexColors: true,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const vortex = new THREE.Points(vortexGeometry, vortexMaterial);
        vortex.position.y = -6;
        scene.add(vortex);

        // Nubes de corazones ajustadas
        const cloudCount = isMobile ? 10 : 20;
        const clouds = [];
        for (let c = 0; c < cloudCount; c++) {
            const cloudGeo = new THREE.BufferGeometry();
            const cloudParticles = isMobile ? 120 : 250;
            const cloudPos = new Float32Array(cloudParticles * 3);
            
            for (let i = 0; i < cloudParticles; i++) {
                cloudPos[i*3] = (Math.random() - 0.5) * 5;
                cloudPos[i*3+1] = (Math.random() - 0.5) * 5;
                cloudPos[i*3+2] = (Math.random() - 0.5) * 5;
            }
            cloudGeo.setAttribute('position', new THREE.BufferAttribute(cloudPos, 3));

            const cloudMat = new THREE.PointsMaterial({
                color: 0xff3388,
                size: 0.08,
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const cloud = new THREE.Points(cloudGeo, cloudMat);
            
            const angle = Math.random() * Math.PI * 2;
            const radius = 8 + Math.random() * 15;
            cloud.position.set(
                Math.cos(angle) * radius,
                (Math.random() - 0.5) * 12 + 2,
                Math.sin(angle) * radius
            );
            
            cloud.userData = { 
                speed: 0.001 + Math.random() * 0.002,
                angle: angle,
                radius: radius,
                yOffset: Math.random() * 10
            };
            
            scene.add(cloud);
            clouds.push(cloud);
        }

        function createLabel(text, size, color, glowColor, fontFamily) {
            const div = document.createElement('div');
            div.textContent = text;
            div.style.color = color;
            div.style.fontSize = size;
            div.style.fontWeight = 'bold';
            div.style.fontFamily = fontFamily || 'Segoe UI, sans-serif';
            div.style.textShadow = `0 0 10px ${glowColor}, 0 0 20px ${glowColor}, 0 0 30px ${glowColor}`;
            div.style.whiteSpace = 'nowrap';
            div.style.opacity = '0';
            div.style.transition = 'opacity 2s, transform 2s';
            return new CSS2DObject(div);
        }

        const phrases = [
            "Te amo muchísimo ", "Mi amorcito 💗", "Mi amor ❤️", 
            "Mi vida ", "Mi todo ♾️", "Mi niño ", 
            "Mi bebé 💕", "Mi cielito ☁️", "Mi corazón ", 
            "Mi precioso", "Mi rey💗", "Tú y yo, siempre ♾️", 
            "Me haces muy feliz 💞", "Mi paz", "Mi sol ☀️", 
            "Mi eterno", "Mi sueño", "Mi pensamiento favorito",
            "Eres mi universo", "Te adoro", "Mi persona favorita"
        ];

        // Tamaño de letra ajustado para móvil
        const phraseSize = isMobile ? "14px" : "18px";
        const phraseRadius = isMobile ? 12 : 14;

        phrases.forEach((phrase, index) => {
            const label = createLabel(phrase, phraseSize, "#ffffff", "#00ffff", "'Segoe UI', sans-serif");
            
            const phi = Math.acos(-1 + (2 * index) / phrases.length);
            const theta = Math.sqrt(phrases.length * Math.PI) * phi;
            
            const r = phraseRadius + Math.random() * 10;
            label.position.set(
                r * Math.cos(theta) * Math.sin(phi),
                r * Math.cos(phi) * 0.6 + 4,
                r * Math.sin(theta) * Math.sin(phi)
            );
            
            label.userData = { 
                baseY: label.position.y, 
                speed: 0.001 + Math.random() * 0.002, 
                offset: Math.random() * 100,
                rotSpeed: (Math.random() - 0.5) * 0.01
            };
            
            scene.add(label);
            
            setTimeout(() => { 
                label.element.style.opacity = '1'; 
                label.element.style.transform = 'scale(1.1)';
            }, 500 + index * 150);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();

            const scale = 1 + Math.sin(time * 3) * 0.06;
            heartParticles.scale.set(scale, scale, scale);
            heartParticles.rotation.y = time * 0.15;
            heartParticles.rotation.z = Math.sin(time * 0.5) * 0.05;

            vortex.rotation.y = time * 0.2;
            vortex.rotation.x = Math.sin(time * 0.3) * 0.02;

            clouds.forEach(cloud => {
                cloud.userData.angle += cloud.userData.speed;
                cloud.position.x = Math.cos(cloud.userData.angle) * cloud.userData.radius;
                cloud.position.z = Math.sin(cloud.userData.angle) * cloud.userData.radius;
                cloud.position.y += Math.sin(time + cloud.userData.yOffset) * 0.005;
                cloud.rotation.y += 0.005;
            });

            scene.children.forEach(child => {
                if (child.isCSS2DObject) {
                    child.position.y = child.userData.baseY + Math.sin(time * 1.5 + child.userData.offset) * 1.2;
                    child.rotation.y = Math.sin(time * 0.5 + child.userData.offset) * 0.15;
                }
            });

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Ocultar el hint después de 4 segundos
        setTimeout(() => {
            document.getElementById('hint').style.opacity = '0';
        }, 4000);

        animate();
    </script>
</body>
</html>
